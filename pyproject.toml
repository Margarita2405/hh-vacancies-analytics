[project]
name = "project4-course-work3-skypro"
version = "0.1.0"
description = ""
authors = [
    {name = "Margarita Bursheva",email = "mbursheva@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
target-version = ['py313']
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119
[tool.poetry.group.dev.dependencies]
mypy = "^1.20.0"
isort = "^8.0.1"
black = "^26.3.1"
pytest = "^9.0.2"
pytest-cov = "^7.1.0"

